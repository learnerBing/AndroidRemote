<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AndroidRemote Cast Receiver</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #waiting { text-align: center; padding: 2rem; }
    #waiting h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #58a6ff; }
    #waiting p { color: #8b949e; font-size: 1.25rem; }
    #code {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 0.5rem;
      margin: 1.5rem 0;
      color: #58a6ff;
    }
    #video-container {
      display: none;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #status { margin-top: 1rem; color: #8b949e; }
    /* On-screen log — this is a Cast receiver on a TV with no accessible devtools, so this is
       the only practical way to see what's happening on-device. Always visible (over the
       waiting screen and over the video) so a failure after the video starts is still legible. */
    #debug-log {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 32vh;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.72);
      color: #7ee787;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 6px 10px;
      white-space: pre-wrap;
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="waiting">
    <h1>AndroidRemote</h1>
    <p>Enter this code on your iPhone</p>
    <div id="code">------</div>
    <p id="status">Waiting for iPhone…</p>
  </div>
  <div id="video-container">
    <!-- muted: V1 broadcast is video-only, and an unmuted <video autoplay> without a prior user
         gesture gets NotAllowedError from Chromium's autoplay policy — play() then rejects and
         the element just sits paused (black) while WebRTC keeps decoding frames underneath.
         Already fixed the same way in test-receiver.html; this was the one place it was missed. -->
    <video id="remote-video" autoplay playsinline muted></video>
  </div>
  <pre id="debug-log"></pre>

  <script>
    const CUSTOM_CHANNEL = 'urn:x-cast:com.androidremote.signaling';
    const STUN = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    let sessionId = null;
    let signalingHost = null;
    let signalingPort = null;
    let peerConnection = null;
    let icePollTimer = null;

    const debugLines = [];
    function logLine(msg) {
      const ts = new Date().toISOString().substr(11, 12);
      const line = `[${ts}] ${msg}`;
      console.log(line);
      debugLines.push(line);
      if (debugLines.length > 60) debugLines.shift();
      const el = document.getElementById('debug-log');
      if (el) {
        el.textContent = debugLines.join('\n');
        el.scrollTop = el.scrollHeight;
      }
    }
    logLine(`receiver loaded — origin=${location.origin}`);

    const context = cast.framework.CastReceiverContext.getInstance();

    context.addCustomMessageListener(CUSTOM_CHANNEL, (event) => {
      logLine(`custom message received, type=${typeof event.data}`);
      try {
        // context.start() below declares this namespace as MessageType.JSON, which tells the
        // CAF receiver SDK to parse the payload for us — event.data arrives as a plain object,
        // not a JSON string. Calling JSON.parse(event.data) on an object coerces it via
        // toString() first ("[object Object]"), which JSON.parse then rejects as invalid
        // ("Unexpected token o in JSON at position 1") — that was silently swallowing every
        // session_prepare message ever sent, the root cause of WebRTC never starting.
        const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        handleCastMessage(data);
      } catch (e) {
        logLine(`invalid cast message: ${e.message}`);
      }
    });

    function handleCastMessage(msg) {
      logLine(`cast message type=${msg.type}`);
      switch (msg.type) {
        case 'session_prepare': {
          const newSessionId = msg.sessionId;
          // A live peerConnection is deliberately kept alive across a dropped Cast control
          // channel (see SENDER_DISCONNECTED below) so backgrounding the app doesn't kill a
          // working stream. But when the phone starts a genuinely *new* broadcast — a different
          // sessionId — that old connection is stale: its own offer/answer already completed, so
          // new ICE candidates from the new session just get silently fed into it (visible as
          // "added N ICE candidate(s)" logging forever with the picture never updating) instead
          // of a fresh negotiation ever happening. Tear it down before adopting the new session.
          if (sessionId && sessionId !== newSessionId && peerConnection) {
            teardownWebRtc(`new session ${String(newSessionId).slice(0, 8)} replacing ${String(sessionId).slice(0, 8)}`);
          }
          sessionId = newSessionId;
          signalingHost = msg.signalingHost;
          signalingPort = msg.signalingPort;
          logLine(`session_prepare session=${String(sessionId).slice(0, 8)} relay=${signalingHost}:${signalingPort}`);
          setStatus('iPhone ready — start screen broadcast on iPhone');
          break;
        }
      }
    }

    function teardownWebRtc(reason) {
      logLine(`teardownWebRtc: ${reason}`);
      if (icePollTimer) {
        clearInterval(icePollTimer);
        icePollTimer = null;
      }
      if (peerConnection) {
        peerConnection.ontrack = null;
        peerConnection.onicecandidate = null;
        peerConnection.onconnectionstatechange = null;
        peerConnection.oniceconnectionstatechange = null;
        peerConnection.close();
        peerConnection = null;
      }
      const video = document.getElementById('remote-video');
      video.srcObject = null;
      document.getElementById('video-container').style.display = 'none';
      document.getElementById('waiting').style.display = 'block';
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function signalingUrl(path) {
      return `http://${signalingHost}:${signalingPort}${path}`;
    }

    async function postJson(path, body, query = '') {
      const url = signalingUrl(path + query);
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) logLine(`POST ${path} HTTP ${res.status}`);
        return res;
      } catch (e) {
        // A blocked mixed-content fetch (HTTPS page → plain-http relay) throws here as a plain
        // "Failed to fetch" TypeError, indistinguishable from a real network error without this
        // being on screen — this is exactly the failure mode we have no other visibility into.
        logLine(`POST ${path} FAILED ${e.name}: ${e.message}`);
        throw e;
      }
    }

    async function getJson(path) {
      const url = signalingUrl(path);
      try {
        const res = await fetch(url);
        if (res.status === 204) return null;
        if (!res.ok) {
          logLine(`GET ${path} HTTP ${res.status}`);
          return null;
        }
        return res.json();
      } catch (e) {
        logLine(`GET ${path} FAILED ${e.name}: ${e.message}`);
        throw e;
      }
    }

    function generatePairingCode() {
      return String(Math.floor(100000 + Math.random() * 900000));
    }

    function sendCastMessage(payload) {
      // senderId is the 2nd positional arg (namespace, senderId, message).
      // Passing `undefined` broadcasts to all connected senders — there's normally
      // just the one iPhone, so this is the simplest correct call.
      context.sendCustomMessage(CUSTOM_CHANNEL, undefined, payload);
    }

    function showVideo() {
      document.getElementById('waiting').style.display = 'none';
      document.getElementById('video-container').style.display = 'block';
    }

    async function waitForOffer() {
      logLine(`polling for offer session=${String(sessionId).slice(0, 8)}`);
      for (let i = 0; i < 120; i++) {
        const msg = await getJson(`/sdp/offer?sessionId=${encodeURIComponent(sessionId)}`);
        if (msg && msg.type === 'offer' && msg.sdp) {
          logLine(`offer received bytes=${msg.sdp.length}`);
          return msg.sdp;
        }
        if (i % 10 === 0 && i > 0) logLine(`still waiting for offer (attempt ${i})`);
        await sleep(500);
      }
      throw new Error('Offer timeout');
    }

    async function startIcePolling() {
      if (icePollTimer) clearInterval(icePollTimer);
      let receivedCount = 0;
      icePollTimer = setInterval(async () => {
        try {
          const list = await getJson(`/ice?sessionId=${encodeURIComponent(sessionId)}&side=sender`);
          if (!list || !list.candidates) return;
          for (const c of list.candidates) {
            await peerConnection.addIceCandidate({
              candidate: c.candidate,
              sdpMid: c.sdpMid,
              sdpMLineIndex: c.sdpMLineIndex,
            });
            receivedCount += 1;
          }
          if (list.candidates.length) logLine(`added ${list.candidates.length} ICE candidate(s), total=${receivedCount}`);
        } catch (e) {
          console.warn('ICE poll error', e);
        }
      }, 300);
    }

    async function startWebRtc() {
      if (!sessionId || !signalingHost || !signalingPort) return;
      logLine(`startWebRtc session=${String(sessionId).slice(0, 8)}`);

      setStatus('Waiting for iPhone screen broadcast…');
      const offerSdp = await waitForOffer();

      peerConnection = new RTCPeerConnection(STUN);
      peerConnection.ontrack = (event) => {
        logLine(`ontrack kind=${event.track && event.track.kind}`);
        const video = document.getElementById('remote-video');
        if (event.streams && event.streams[0]) {
          video.srcObject = event.streams[0];
        } else if (event.track) {
          video.srcObject = new MediaStream([event.track]);
        }
        // Belt-and-suspenders alongside the `muted` HTML attribute above — see the comment on
        // the <video> tag for why this is required for autoplay to actually take effect.
        video.muted = true;
        video.play()
          .then(() => logLine('video.play() resolved'))
          .catch((e) => logLine(`video.play() REJECTED ${e.name}: ${e.message}`));
        showVideo();
        setStatus('Connected');
        sendCastMessage({ type: 'status', state: 'connected' });
      };

      peerConnection.onicecandidate = (event) => {
        if (!event.candidate) return;
        postJson('/ice', {
          sessionId,
          candidate: event.candidate.candidate,
          sdpMid: event.candidate.sdpMid,
          sdpMLineIndex: event.candidate.sdpMLineIndex,
        }, '?side=receiver').catch((e) => logLine(`POST /ice error: ${e.message}`));
      };

      peerConnection.onconnectionstatechange = () => {
        logLine(`connectionState=${peerConnection.connectionState}`);
      };
      peerConnection.oniceconnectionstatechange = () => {
        logLine(`iceConnectionState=${peerConnection.iceConnectionState}`);
      };

      await peerConnection.setRemoteDescription({ type: 'offer', sdp: offerSdp });
      logLine('setRemoteDescription OK');
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      logLine('setLocalDescription OK, posting answer');

      await postJson('/sdp', {
        sessionId,
        type: 'answer',
        sdp: answer.sdp,
      });
      logLine('answer posted OK');

      startIcePolling();
    }

    // Show pairing code and notify iPhone when Cast session connects.
    const pairingCode = generatePairingCode();
    document.getElementById('code').textContent = pairingCode;

    context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => {
      logLine('sender connected — sending pairing_code');
      sendCastMessage({ type: 'pairing_code', code: pairingCode });
      setStatus('Code sent to iPhone — tap Connect to TV');
    });

    // Sender may already be connected when listener attaches.
    if (context.getSenders().length > 0) {
      logLine('sender already connected at attach — sending pairing_code');
      sendCastMessage({ type: 'pairing_code', code: pairingCode });
    }

    context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, () => {
      // The Cast *control* channel (used only for pairing_code/session_prepare) drops whenever
      // the main app backgrounds — normal and expected, since the Broadcast Extension keeps
      // streaming independently of the main app's lifecycle. The already-negotiated WebRTC media
      // connection doesn't depend on this channel at all once established, so don't nuke a
      // working stream just because the sender's control connection dropped.
      const mediaIsLive = peerConnection && peerConnection.connectionState === 'connected';
      if (mediaIsLive) {
        logLine('sender disconnected — media still live, leaving WebRTC connected');
        return;
      }
      teardownWebRtc('sender disconnected — no active media');
      location.reload();
    });

    // Poll for session_prepare then WebRTC (session_prepare arrives via custom message).
    setInterval(() => {
      if (sessionId && signalingHost && !peerConnection) {
        startWebRtc().catch((e) => {
          logLine(`startWebRtc FAILED ${e.name}: ${e.message}`);
          setStatus('Connection error — waiting for broadcast…');
        });
      }
    }, 1000);

    context.start({
      disableIdleTimeout: true,
      customNamespaces: { [CUSTOM_CHANNEL]: cast.framework.system.MessageType.JSON },
    });
  </script>
</body>
</html>
